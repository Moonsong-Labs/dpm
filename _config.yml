title: Git-based DAR dependencies
description: "Git-hosted prebuilt DAR files as dpm dependencies: syntax, technical design, and a demo project. Dev Fund Proposal #105 by Moonsong Labs."
url: https://moonsong-labs.github.io
baseurl: /dpm
lang: en_US
logo: /assets/icons/icon-512.png
favicon_ico: /favicon.ico
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/og.png
        width: 1200
        height: 630
        alt: "Git-based DAR dependencies for dpm, by Moonsong Labs"
twitter:
  username: moonsonglabs_
  card: summary_large_image

remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

search_enabled: true
heading_anchors: true

aux_links:
  "GitHub":
    - "https://github.com/Moonsong-Labs/dpm"
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/Moonsong-Labs/dpm
gh_edit_branch: gh-pages
gh_edit_view_mode: edit

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow

mermaid:
  version: "11.4.1"
